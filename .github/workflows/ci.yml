name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just sync
      - run: just format-check
      - run: just lint
      - run: just test
