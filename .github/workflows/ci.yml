name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  ogc-processes-ets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - name: Start API
        run: |
          uv run --package roofer-online-processes-api uvicorn api.main:app --host 0.0.0.0 > /tmp/ogc-api.log 2>&1 &
          echo $! > /tmp/ogc-api.pid
      - name: Start OGC TEAM Engine ETS
        run: docker run --network host --detach --name ogc-processes-ets ogccite/ets-ogcapi-processes10
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health >/dev/null && curl --fail --silent http://localhost:8080/teamengine/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ogc-api.log
          docker logs ogc-processes-ets
          exit 1
      - name: Run OGC API - Processes ETS
        run: python docker/ets-ogcapi-processes/run_ets.py
      - name: Save ETS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogc-processes-ets-report
          path: artifacts/ogc-processes-ets.xml
          if-no-files-found: ignore
      - name: Stop containers and API
        if: always()
        run: |
          docker rm --force ogc-processes-ets || true
          if [ -f /tmp/ogc-api.pid ]; then kill "$(cat /tmp/ogc-api.pid)" || true; fi
