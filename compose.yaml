services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ROOFER_PROCESSES_PUBLIC_BASE_URL: https://processes.staging.roofer-online.nl
    ports:
      - "127.0.0.1:18082:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
