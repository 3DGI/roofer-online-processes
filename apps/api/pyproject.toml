[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project]
name = "roofer-online-processes-api"
version = "0.1.0"
description = "Reference OGC API - Processes service for Roofer Online"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ogc-processes",
    "shapely>=2.1,<3",
]

[dependency-groups]
dev = [
    "anyio>=4.0,<4.15",
    "httpx2>=2.13.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "jsonschema>=4",
    "types-shapely>=2.1.0.20260728",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv.sources]
ogc-processes = { workspace = true }
[tool.uv.build-backend]
module-name = "api"
