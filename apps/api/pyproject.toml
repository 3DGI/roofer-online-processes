[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project]
name = "roofer-online-processes-api"
version = "0.1.0"
description = "Reference OGC API - Processes service for Roofer Online"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "ogc-processes"]

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=8.3.0", "mypy>=1.13.0", "ruff>=0.8.0"]

[tool.uv.sources]
ogc-processes = { workspace = true }
[tool.uv.build-backend]
module-name = "api"

