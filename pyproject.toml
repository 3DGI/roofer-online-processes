[tool.uv.workspace]
members = ["packages/ogc-processes", "packages/roofer-processes-contracts", "apps/api"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages/ogc-processes/tests", "packages/roofer-processes-contracts/tests", "apps/api/tests"]
